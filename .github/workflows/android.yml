name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "repository_name=AEE" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode signing keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/signing_cert.p12
          else
            echo "Error: SIGNING_CERT_P12 secret is empty!"
            exit 1
          fi

      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean up signing keystore
        if: always()
        run: rm -f app/signing_cert.p12

      - name: Upload APK Release - ${{ env.repository_name }}
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.repository_name }}-${{ env.date_today }}-release
          path: app/build/outputs/apk/**/release/*.apk