plugins {
    alias(libs.plugins.androidApplication)
}

android {
    signingConfigs {
        release {
            def keystoreFile = file("signing_cert.p12")
            if (keystoreFile.exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                storeFile keystoreFile
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileSdkVersion 37
    namespace 'com.apk.editor'

    defaultConfig {
        minSdkVersion 23
        targetSdk 37
        versionCode 36
        versionName "v0.36"
        vectorDrawables.useSupportLibrary = true
        testFunctionalTest = false
        testHandleProfiling = false

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("signing_cert.p12").exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions.add("release")
    productFlavors {
        play {
            applicationId "com.apk.explorer"
            dimension "release"
        }
        full {
            applicationId "com.apk.editor"
            dimension "release"
        }
    }
    lint {
        abortOnError false
    }

}

dependencies {
    api(project(":navView"))

    implementation libs.apksig
    implementation libs.axml
    implementation libs.crashReporter

    implementation libs.apkutils
    implementation libs.adapters
    implementation libs.credits
    implementation libs.fileutils
    implementation libs.installerutils
    implementation libs.packageutils
    implementation libs.permissionutils
    implementation libs.themeutils
    implementation libs.translatorutils

    implementation libs.documentfile
    implementation libs.material
    implementation libs.zip4j
    implementation libs.baksmali
    implementation libs.smali
}